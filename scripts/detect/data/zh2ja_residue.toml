# saga-translator 残渣検出辞書: zh→ja 方向
# check_zh_vocab.py / find_cn_residue.py から機械的に移設（作品固有語は除外）。
# 作品固有語（林霖・米姆・苏苏・小茉 等）は house_style.toml の known_terms で扱う。
# 単字ヒットは「語の一部として実害のある残渣」に限定し、周辺と結合した語が
# 語辞書（simp_words / ja_ok_words）にあれば除外する（語単位の判定を主とする）。
#
# 中国語語彙 → 日本語（文脈非依存で安全なものだけ）
# 「字は日本語正字だが語が中国語」のパターン
[vocab]
"搏動" = "脈打つ"
"搏动" = "脈打つ"
"紅暈" = "紅潮"
"红晕" = "紅潮"
"翕動" = "震え"
"翕动" = "震え"
"醇厚" = "濃厚"
"綬帯" = "綬"
"绶带" = "綬"
"星辰" = "星"
"浩瀚" = "広大"
"慵懒" = "怠惰"
"慵懶" = "倦怠"
"怔然" = "呆然"
"醇酽" = "芳醇"

# 中国語の成語・慣用句（字は日本語正字なので字形検査を素通りする）
[idioms]
"从容不迫" = "悠然と"
"全神贯注" = "全身全霊で"
"毫不犹豫" = "ためらわず"
"不可思议" = "信じがたい"
"不由自主" = "思わず"
"不知所措" = "戸惑う"
"怒火中烧" = "怒りが燃え上がる"
"心急如焚" = "気が気でない"
"心如死灰" = "心が死んだよう"
"如释重负" = "肩の荷が下りた"
"目瞪口呆" = "呆然と"
"欣喜若狂" = "狂喜する"
"痛不欲生" = "生き地獄"
"无言以对" = "言葉が出ない"
"面红耳赤" = "顔を赤らめ"
"迫不及待" = "待ちきれず"
"情不自禁" = "思わず"
"恍然大悟" = "はっと悟る"
"不寒而栗" = "背筋が凍る"
"势不可挡" = "勢い止められず"
"震耳欲聋" = "耳を劈く"
"难以置信" = "信じがたい"
"淋漓尽致" = "余すところなく"
"肆无忌惮" = "忌憚なく"
"不容置疑" = "疑う余地なく"
"翻江倒海" = "天地を揺るがす"

# 簡体字専用文字 → 日本語（単字。「語の一部として実害のある残渣」に限定する。
# 語単位の判定は simp_words / ja_ok_words が担う）
[simp]
"缆" = "纜"
"涩" = "渋"
"狮" = "獅"
"铃" = "鈴"
"拦" = "攔"
"烫" = "燙"
"兰" = "蘭"
"罗" = "羅"
"图" = "図"
"团" = "団"
"张" = "張"
"发" = "発"
"谁" = "誰"
"样" = "様"
"书" = "書"
"东" = "東"
"车" = "車"
"马" = "馬"
"鸟" = "鳥"
"鱼" = "魚"
"门" = "門"
"问" = "問"
"间" = "間"
"关" = "関"
"怀" = "懐"
"挠" = "撓"
"拧" = "捩"
"脏" = "臓"
"惊" = "驚"
"对" = "対"
"应" = "応"
"战" = "戦"
"泪" = "涙"
"蛊" = "蠱"
"闷" = "悶"
"锤" = "鎚"
"钉" = "釘"
"荡" = "蕩"
"养" = "養"
"倔" = "頑"
"丫" = "娘"
"忐" = "胸をざわ"
"忑" = "つかせ"
"腼" = "はにかんだ"
"腆" = "物静かな"
# 憂・鬱 の簡略体（忧郁 等）。郁 は日本語の語（馥郁）にも使う字なので、
# 語単位の除外（ja_ok_words）と併せて判定する（忧郁 は simp_words で検出）。
"忧" = "憂"
"郁" = "鬱"

# 2字以上の語（語単位の判定を主とする）。単字より先に語で判定する。
[simp_words]
"说话" = "話"
"忧郁" = "憂鬱"

# 日本語として正当な語（単字ヒットの除外根拠）。
# 周辺と結合した語がここにあれば、単字では検出しない。
# 馥郁: 日本語の語（ふくいく）。郁 は中国語の簡略体（忧郁 等）でも使うが、
#       日本語の語の中では正当なので単字ヒット（郁）を除外する。
[ja_ok_words]
"馥郁" = true

# 中国語の定型語（汎用のみ。作品固有語は含めない）
[cn_words]

# 誤検知許容ワード
[allow]
SNS = true
Day = true
M = true
